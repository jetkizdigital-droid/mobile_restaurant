include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # These are style-only preferences. Runtime-safety and deprecation lints
    # stay enabled and are enforced by plain `flutter analyze` in CI.
    file_names: false
    unnecessary_underscores: false
    use_null_aware_elements: false

analyzer:
  exclude:
    - lib_backup_before_encoding_fix/**
