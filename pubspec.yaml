name: jetkiz_restaurant
description: "JETKIZ restaurant application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network / storage
  http: ^1.6.0
  http_parser: ^4.0.2
  dio: ^5.4.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.2

  # Media / upload
  image_picker: ^1.2.1
  flutter_image_compress: ^2.3.0
  video_player: ^2.9.2
  just_audio: ^0.9.46

  # Formatting
  intl: ^0.20.2

  # Push notifications / crash reporting
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/jetkiz_wordmark.png
