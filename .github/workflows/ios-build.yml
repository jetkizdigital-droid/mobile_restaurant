name: iOS build validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'

jobs:
  ios-unsigned-build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Verify release bundle configuration
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'com.example.jetkiz' ios/Runner.xcodeproj/project.pbxproj
          grep -E 'PRODUCT_BUNDLE_IDENTIFIER = asia.jetkiz.(courier|restaurant);' ios/Runner.xcodeproj/project.pbxproj

      - name: Validate iOS sources
        run: flutter analyze --no-fatal-infos

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Inspect built app bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphoneos/Runner.app/Info.plist

      - name: Upload unsigned build for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: build/ios/iphoneos/Runner.app
          retention-days: 3
