name: Restaurant Release Hardening Once

on:
  push:
    branches:
      - fix/restaurant-google-play-production

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[release-fixes-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/restaurant-google-play-production
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply deterministic release fixes
        run: python3 tool/apply_google_play_release_fixes.py

      - name: Harden permanent release CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/flutter-ci.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

"""
          new = """      - name: Verify Dart source encoding
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          for root in ('lib', 'test'):
              for source in Path(root).rglob('*.dart'):
                  source.read_text(encoding='utf-8')
          print('All Dart sources are UTF-8')
          PY2

      - name: Format check release-critical Dart
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/push/restaurant_push_notification_service.dart
          lib/features/auth/presentation/pages/restaurant_auth_page.dart
          lib/features/auth/presentation/pages/restaurant_sms_page.dart
          lib/features/orders/presentation/widgets/order_card.dart
          lib/features/support/presentation/pages/restaurant_support_page.dart
          test/release_compliance_test.dart

"""
          if old not in text:
              raise SystemExit('Expected permanent CI format step not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format changed Dart files
        run: >-
          dart format
          lib/core/push/restaurant_push_notification_service.dart
          lib/features/auth/presentation/pages/restaurant_auth_page.dart
          lib/features/auth/presentation/pages/restaurant_sms_page.dart
          lib/features/orders/presentation/widgets/order_card.dart
          lib/features/support/presentation/pages/restaurant_support_page.dart
          test/release_compliance_test.dart

      - name: Verify Dart source encoding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for root in ('lib', 'test'):
              for source in Path(root).rglob('*.dart'):
                  source.read_text(encoding='utf-8')
          print('All Dart sources are UTF-8')
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Android release policy checks
        run: |
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          ! grep -R 'fullScreenIntent: true' lib
          ! grep -R 'AndroidNotificationCategory.alarm' lib
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare ephemeral CI release signing
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/restaurant-ci-upload.jks" \
            -storepass ci-not-for-production \
            -keypass ci-not-for-production \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -alias restaurant-ci \
            -dname "CN=JETKIZ CI,O=JETKIZ,C=KZ"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/restaurant-ci-upload.jks
          storePassword=ci-not-for-production
          keyAlias=restaurant-ci
          keyPassword=ci-not-for-production
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test android .github/workflows/flutter-ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(release): harden restaurant app for Google Play [release-fixes-applied]"
          git push origin HEAD:fix/restaurant-google-play-production
