name: iOS TestFlight release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 70
    environment: ios-release
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify Xcode SDK before building
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26 || { echo "iOS 26 SDK required"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate credentials are configured
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          FIREBASE: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          for name in CERT PASSWORD PROFILE TEAM API_KEY ISSUER KEY_B64 FIREBASE; do
            if [[ -z "${!name}" ]]; then echo "Missing required iOS release secret: $name"; exit 1; fi
          done

      - name: Prepare signing assets and Firebase config
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_B64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          FIREBASE: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ios-signing/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/ios-signing/distribution.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/ios-signing/profile.mobileprovision"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/ios-signing/private_keys/AuthKey_${API_KEY}.p8"
          printf '%s' "$FIREBASE" | base64 --decode > ios/Runner/GoogleService-Info.plist
          security create-keychain -p "${RUNNER_TEMP##*/}-ios" "$RUNNER_TEMP/ios-signing/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ios-signing/signing.keychain-db"
          security unlock-keychain -p "${RUNNER_TEMP##*/}-ios" "$RUNNER_TEMP/ios-signing/signing.keychain-db"
          security import "$RUNNER_TEMP/ios-signing/distribution.p12" -k "$RUNNER_TEMP/ios-signing/signing.keychain-db" -P "$PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP##*/}-ios" "$RUNNER_TEMP/ios-signing/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ios-signing/signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/ios-signing/profile.mobileprovision" > "$RUNNER_TEMP/ios-signing/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/ios-signing/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/ios-signing/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/ios-signing/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/ios-signing/profile.plist")
          BUNDLE_ID="asia.jetkiz.restaurant"
          [[ -n "$BUNDLE_ID" && "$PROFILE_TEAM" == "$TEAM" && "$PROFILE_APP_ID" == "$TEAM.$BUNDLE_ID" ]] || { echo 'Provisioning profile does not match Team ID / Bundle ID'; exit 1; }
          cp "$RUNNER_TEMP/ios-signing/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          export PROFILE_NAME BUNDLE_ID
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path('ios/Runner.xcodeproj/project.pbxproj')
          content = path.read_text()
          content = content.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          content = content.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";')
          bundle_id = os.environ['BUNDLE_ID']
          content = content.replace('PRODUCT_BUNDLE_IDENTIFIER = ' + bundle_id + ';', 'PRODUCT_BUNDLE_IDENTIFIER = ' + bundle_id + ';\n\t\t\t\tDEVELOPMENT_TEAM = ' + os.environ['TEAM'] + ';\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + os.environ['PROFILE_NAME'] + '";')
          path.write_text(content)
          PY

      - name: Generate export options
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF

      - name: Install JETKIZ iOS app icon
        run: bash tool/install_ios_app_icon.sh

      - name: Build signed IPA
        run: |
          flutter pub get
          flutter build ipa --release --build-number="$((100000 + GITHUB_RUN_NUMBER))" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA to TestFlight
        env:
          API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/ios-signing/private_keys/AuthKey_${API_KEY}.p8" "$HOME/.appstoreconnect/private_keys/"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$API_KEY" --apiIssuer "$ISSUER"

      - name: Remove temporary signing materials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/ios-signing" "$HOME/.appstoreconnect/private_keys"
          rm -f ios/Runner/GoogleService-Info.plist
